<title>Bingo Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: played sideways. A sunny little Paris you build up (the lobby map), with chunky glossy plum-and-gold buttons laid over it. */
:root {
  --ol: #3d1a4f;            /* chunky outline, dark plum */
  --ink: #3d1a4f;
  --plum1: #b07cff; --plum2: #7b3fe0; --plum3: #4f1fa3;
  --gold1: #ffe58f; --gold2: #f7b924; --gold3: #c98a0b;
  --cream: #fff7e8; --paper: #fffdf7; --sand: #f3dcae;
  --rose: #ff8fb1; --green1: #8ff07a; --green2: #3fb43a; --sky: #8fd8f0;
  --mist: #8a6f9c;
  --ui: 'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: #f0d7a6; color: var(--ink); font-family: var(--ui); font-weight: 500; font-size: 15px; overflow: hidden; -webkit-font-smoothing: antialiased; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; }

/* text with a chunky outline */
.outl { color: #fff; text-shadow: 0 2px 0 var(--ol), 2px 0 0 var(--ol), -2px 0 0 var(--ol), 0 -2px 0 var(--ol), 1.5px 1.5px 0 var(--ol), -1.5px 1.5px 0 var(--ol), 1.5px -1.5px 0 var(--ol), -1.5px -1.5px 0 var(--ol), 0 4px 0 var(--ol); }

/* glossy 3D buttons */
.b3 { position: relative; border: 3px solid var(--ol); border-radius: 18px; font-weight: 700; letter-spacing: .02em; box-shadow: 0 5px 0 var(--ol), inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.12); transition: transform .08s, box-shadow .08s; }
.b3:not(:disabled):active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ol), inset 0 3px 0 rgba(255,255,255,.55); }
.b3:disabled { filter: saturate(.25) brightness(.95); cursor: default; }
.b3.gold { background: linear-gradient(180deg, var(--gold1), var(--gold2) 60%, #f0a40f); color: var(--ink); }
.b3.plum { background: linear-gradient(180deg, var(--plum1), var(--plum2) 60%, var(--plum3)); color: #fff; }
.b3.green { background: linear-gradient(180deg, var(--green1), var(--green2)); color: #fff; }
.b3.cream { background: linear-gradient(180deg, #fff, #f6e7cc); color: var(--ink); }

/* ---------- title ---------- */
#title { display: grid; place-items: center; background: radial-gradient(70% 90% at 50% 20%, #fff6d8 0%, #ffd1e0 45%, #b78cf2 100%); }
#title .in { display: grid; justify-items: center; gap: 2px; text-align: center; }
#title canvas { width: min(150px, 34vh); height: min(150px, 34vh); }
.logo { font-family: var(--display); font-style: italic; font-weight: 700; font-size: clamp(44px, 14vh, 76px); line-height: .95; margin: 0; color: #fff4c9;
  text-shadow: 0 3px 0 #b07a12, 0 6px 0 var(--ol), 0 10px 24px rgba(61,26,79,.35); }
.by { font-family: var(--ui); font-weight: 600; font-size: 13px; letter-spacing: .34em; text-transform: uppercase; color: var(--ol); opacity: .8; margin-bottom: 14px; }
#title .b3 { font-size: 22px; padding: 12px 40px; }
.clouds { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.clouds i { position: absolute; width: 160px; height: 46px; border-radius: 40px; background: #fff; opacity: .85; animation: drift 38s linear infinite; }
.clouds i::before, .clouds i::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.clouds i::before { width: 70px; height: 70px; left: 24px; top: -36px; }
.clouds i::after { width: 54px; height: 54px; left: 78px; top: -24px; }
@keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(110vw); } }

/* ---------- map lobby ---------- */
#mapWrap { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; cursor: grab; }
#mapWrap::-webkit-scrollbar { display: none; }
#mapSvg { display: block; height: 100%; }
.lm { cursor: pointer; }
.lm:active { filter: brightness(1.08); }
.twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 50% { transform: scale(.4); opacity: .3; } }
.bounce { animation: bob 1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.wave { stroke-dasharray: 14 30; animation: flow 3s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -88; } }
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-top { top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.lvl { display: flex; align-items: center; }
.lvl .badge { position: relative; z-index: 1; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 30%, var(--plum1), var(--plum3)); border: 3px solid var(--gold2); box-shadow: 0 0 0 3px var(--ol); font-weight: 700; font-size: 20px; }
.lvl .badge small { text-shadow: none; position: absolute; bottom: -9px; padding: 0 6px; border-radius: 8px; background: var(--gold2); color: var(--ink); font-size: 10px; border: 2px solid var(--ol); line-height: 1.3; }
.lvl .xp { margin-left: -12px; width: 108px; height: 18px; border-radius: 10px; background: rgba(61,26,79,.75); border: 2.5px solid var(--ol); overflow: hidden; position: relative; }
.lvl .xp i { display: block; height: 100%; background: linear-gradient(180deg, #ffe58f, #f7b924); }
.lvl .xp span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 var(--ol); }
.cur { display: flex; align-items: center; height: 32px; padding: 0 12px 0 0; border-radius: 18px; background: rgba(61,26,79,.78); border: 2.5px solid var(--ol); color: #fff; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.cur .ic { width: 36px; height: 36px; margin: -4px 6px -4px -8px; flex: none; }
.spacer { flex: 1; }
.round { display: grid; justify-items: center; gap: 0; width: 64px; }
.round .c { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--ol); box-shadow: 0 4px 0 var(--ol), inset 0 3px 0 rgba(255,255,255,.5); background: radial-gradient(circle at 40% 30%, #9fe8ff, #2f9fe0); position: relative; }
.round .c svg { width: 34px; height: 34px; }
.round .c.pl { background: radial-gradient(circle at 40% 30%, var(--plum1), var(--plum3)); }
.round .c.gd { background: radial-gradient(circle at 40% 30%, #fff1b0, var(--gold2)); }
.round .c.pk { background: radial-gradient(circle at 40% 30%, #ffd0e0, #ff6f9d); }
.round .lb { margin-top: -6px; position: relative; padding: 0 7px; border-radius: 9px; background: rgba(61,26,79,.85); color: #fff; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.round .dot { position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: #ff4d6d; border: 2.5px solid #fff; }
.round:active .c { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }
.hud-left { left: max(10px, env(safe-area-inset-left, 0px)); top: calc(74px + env(safe-area-inset-top, 0px)); display: grid; gap: 4px; }
.hud-right { right: max(10px, env(safe-area-inset-right, 0px)); top: calc(66px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; }
.hud-play { right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.hud-play .b3 { font-size: 30px; padding: 8px 34px 10px; border-radius: 22px; display: grid; line-height: 1; }
.hud-play .b3 small { font-size: 12px; font-weight: 600; letter-spacing: .04em; margin-top: 2px; }
.city { display: grid; gap: 2px; min-width: 120px; padding: 3px 10px 5px; border-radius: 14px; background: rgba(255,247,232,.94); border: 2.5px solid var(--ol); }
.city b { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; line-height: 1.2; }
.city .pbar { height: 9px; }
.pbar { height: 12px; border-radius: 7px; background: #e6d5b8; border: 2px solid var(--ol); overflow: hidden; }
.pbar i { display: block; height: 100%; background: linear-gradient(180deg, #ffe58f, #f7b924); }

/* ---------- panels and sheets ---------- */
.veil { position: fixed; inset: 0; z-index: 30; background: rgba(40,14,52,.55); display: grid; place-items: center; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.panel { position: relative; width: min(860px, 100%); max-height: 100%; box-sizing: border-box; border-radius: 26px; background: var(--cream); border: 4px solid var(--ol); box-shadow: 0 8px 0 var(--ol), inset 0 0 0 5px #f2dcae; padding: 16px 18px; display: grid; gap: 12px; overflow: auto; animation: popIn .28s cubic-bezier(.2,.9,.3,1.25); }
.panel.small { width: min(460px, 100%); }
@keyframes popIn { from { transform: scale(.88); opacity: 0; } }
.panel h3 { margin: 0; font-size: 26px; font-weight: 700; color: var(--ink); }
.panel p { margin: 0; line-height: 1.45; }
.panel ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; line-height: 1.4; }
.x { position: absolute; top: 8px; right: 10px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 30%, #ff9a9a, #e5383b); border: 3px solid var(--ol); box-shadow: 0 3px 0 var(--ol); color: #fff; font-size: 22px; font-weight: 700; z-index: 2; }
.tabs { display: flex; gap: 6px; }
.tabs button { padding: 6px 18px; border-radius: 14px 14px 6px 6px; border: 3px solid var(--ol); font-weight: 700; font-size: 17px; background: linear-gradient(180deg, #9db8ff, #4f74e0); color: #fff; text-shadow: 0 2px 0 var(--ol); }
.tabs button[aria-pressed="true"] { background: linear-gradient(180deg, var(--plum1), var(--plum2)); }
.posters { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x mandatory; }
.poster { flex: none; scroll-snap-align: start; width: min(200px, 30vh * 1.1); aspect-ratio: 3 / 4; border-radius: 18px; border: 4px solid var(--ol); overflow: hidden; position: relative; box-shadow: 0 5px 0 var(--ol); text-align: center; }
.poster svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.poster .tag { position: absolute; top: 0; right: 0; padding: 3px 10px 4px 14px; border-radius: 0 0 0 14px; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 var(--ol); border-left: 3px solid var(--ol); border-bottom: 3px solid var(--ol); }
.poster .tag.new { background: linear-gradient(180deg, var(--green1), var(--green2)); }
.poster .tag.soon { background: linear-gradient(180deg, #9db8ff, #4f74e0); }
.poster .nm { position: absolute; left: 0; right: 0; top: 14%; font-size: clamp(20px, 6.6vh, 30px); font-weight: 700; line-height: .95; }
.poster .foot { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 4px; border-radius: 12px; background: rgba(61,26,79,.8); color: #fff; font-size: 12px; font-weight: 600; }
.poster.locked .art { filter: saturate(.35) brightness(.85); }
.poster .lock { position: absolute; left: 0; right: 0; bottom: 14px; display: grid; place-items: center; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pick { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border-radius: 18px; border: 3px solid var(--ol); background: #fff; box-shadow: 0 4px 0 var(--ol); font-weight: 700; }
.pick[aria-pressed="true"] { background: linear-gradient(180deg, #f3e8ff, #dcc4ff); box-shadow: 0 4px 0 var(--ol), inset 0 0 0 3px var(--plum2); }
.pick .mini { display: flex; gap: 3px; height: 34px; align-items: center; }
.pick .mini i { width: 22px; height: 28px; border-radius: 4px; background: linear-gradient(180deg, var(--plum2) 0 22%, var(--paper) 22%); border: 2px solid var(--ol); }
.pick small { font-size: 12px; color: var(--mist); font-weight: 600; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #fff; border: 2px solid #ead6b2; font-weight: 600; }
.sw { width: 54px; height: 32px; border-radius: 16px; background: #d9c8e8; border: 3px solid var(--ol); position: relative; flex: none; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--ol); transition: transform .18s; }
.sw[aria-pressed="true"] { background: var(--green2); }
.sw[aria-pressed="true"]::after { transform: translateX(22px); }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: #efe1c6; }
.seg button { padding: 5px 10px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--mist); }
.seg button[aria-pressed="true"] { background: var(--plum2); color: #fff; }

/* ---------- play ---------- */
#play { display: grid; grid-template-columns: minmax(170px, 24%) 1fr; gap: 10px; padding: max(8px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.7) 0 2px, transparent 3px) 0 0 / 34px 34px, linear-gradient(135deg, #ffd8e6 0%, #ffeccc 55%, #d9f2ff 100%); }
.side { display: flex; flex-direction: column; gap: 6px; min-height: 0; border-radius: 22px; padding: 8px; background: rgba(255,253,247,.92); border: 3px solid var(--ol); box-shadow: 0 5px 0 var(--ol); }
.side .row { display: flex; justify-content: space-between; align-items: center; }
.mini-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--ol); box-shadow: 0 3px 0 var(--ol); background: linear-gradient(180deg, #fff, #f1e2c6); }
.mini-btn svg { width: 20px; height: 20px; stroke: var(--ol); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.room-nm { font-weight: 700; font-size: 13px; text-align: center; line-height: 1.05; }
.ball { --s: min(80px, 20vh); width: var(--s); height: var(--s); margin: 0 auto; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--ol); flex: none;
  background: radial-gradient(circle at 35% 28%, #fff 0 14%, var(--bc, var(--gold1)) 55%, color-mix(in srgb, var(--bc, var(--gold2)) 62%, #000) 100%); box-shadow: 0 5px 0 var(--ol); }
.ball .in { width: 66%; height: 66%; border-radius: 50%; background: var(--paper); display: grid; place-items: center; align-content: center; line-height: 1; border: 2px solid rgba(61,26,79,.25); }
.ball .in small { font-size: calc(var(--s) * .14); font-weight: 700; }
.ball .in b { font-size: calc(var(--s) * .3); font-weight: 700; font-variant-numeric: tabular-nums; }
.ball.pop { animation: ballIn .5s cubic-bezier(.2,.9,.3,1.3); }
@keyframes ballIn { from { transform: translateX(-60px) rotate(-200deg) scale(.5); opacity: 0; } }
.recent { display: flex; justify-content: center; gap: 4px; min-height: 22px; }
.recent span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--bc); border: 2px solid var(--ol); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.stat { display: grid; padding: 3px 6px; border-radius: 10px; background: #f6ead3; font-size: 10.5px; font-weight: 600; color: var(--mist); line-height: 1.15; text-align: center; }
.stat b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat.hot b { color: #e5383b; }
.boost { margin-top: auto; display: grid; gap: 5px; }
.meter { height: 12px; border-radius: 7px; background: #e6d5b8; border: 2px solid var(--ol); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--gold2)); transition: width .3s; }
.boost .b3 { font-size: 15px; padding: 6px; border-radius: 14px; }
.boost .b3:not(:disabled) { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.18); } }
#cards { display: grid; grid-template-columns: 1fr auto; gap: 10px; min-width: 0; min-height: 0; height: 100%; }
.bigs { display: flex; justify-content: center; align-items: center; gap: 10px; min-width: 0; min-height: 0; height: 100%; }
.minis { display: none; flex-direction: column; justify-content: center; align-items: center; gap: 8px; }
#cards.has-minis .minis { display: flex; }
.minis .bcard { width: 92px; cursor: pointer; box-shadow: 0 3px 0 var(--ol); }
.minis .bcard * { pointer-events: none; }
.minis .bcard.ready { box-shadow: 0 0 0 3px var(--gold2), 0 0 18px var(--gold2); animation: pulse 1s ease-in-out infinite; }
.minis .bcard.ready::after { content: 'BINGO!'; position: absolute; left: 50%; top: 40%; transform: translateX(-50%); padding: 2px 6px; border-radius: 8px; background: var(--gold2); border: 2px solid var(--ol); font-weight: 700; font-size: 12px; }
.swap { font-size: 13px; padding: 5px 10px; border-radius: 12px; }
.auto { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
.auto .sw { width: 44px; height: 26px; }
.auto .sw::after { width: 16px; height: 16px; }
.auto .sw[aria-pressed="true"]::after { transform: translateX(18px); }
.bleft { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 3px 10px; border-radius: 12px; background: linear-gradient(180deg, #6f8df5, #3a52c4); border: 2.5px solid var(--ol); color: #fff; }
.bleft small { display: block; font-size: 11px; font-weight: 600; line-height: 1.15; }
.bleft b { font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 var(--ol); }
.bleft.hot { background: linear-gradient(180deg, #ff8a8a, #d63a3a); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.btn2 { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.alert-btn { display: flex; align-items: center; gap: 3px; padding: 4px 8px; border-radius: 14px; font-size: 15px; }
.alert-btn svg { width: 22px; height: 22px; }
.alert-btn.on { background: linear-gradient(180deg, #fff6b0, #ffd23f); }
.cell.hint { box-shadow: 0 0 0 2.5px var(--gold2), 0 0 12px rgba(247,185,36,.95); animation: hintGlow 1s ease-in-out infinite; }
@keyframes hintGlow { 50% { background: #fff3c4; } }
.bcard { width: var(--cw, 220px); container-type: inline-size; flex: none; border-radius: 16px; overflow: hidden; background: var(--paper); border: 3px solid var(--ol); box-shadow: 0 5px 0 var(--ol); display: grid; position: relative; }
.bcard .hdr { display: grid; grid-template-columns: repeat(5, 1fr); background: linear-gradient(180deg, var(--plum1), var(--plum2)); border-bottom: 3px solid var(--ol); }
.bcard .hdr span { text-align: center; font-weight: 700; font-size: 9.5cqw; line-height: 1.25; color: #fff4c9; text-shadow: 0 2px 0 var(--ol); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.4cqw; padding: 2cqw; }
.cell { aspect-ratio: 1; border-radius: 2.6cqw; background: #fff; box-shadow: inset 0 0 0 1.5px #eadcc3, inset 0 -1.2cqw 0 #f3e9d6; display: grid; place-items: center; position: relative; font-weight: 700; font-size: 8cqw; font-variant-numeric: tabular-nums; color: var(--ink); }
.cell .tr { position: absolute; top: 3%; right: 3%; width: 38%; height: 38%; }
.cell svg.bl { position: absolute; inset: 2%; width: 96%; height: 96%; animation: bloom .38s cubic-bezier(.2,.9,.3,1.4); }
@keyframes bloom { from { transform: scale(.2) rotate(-60deg); opacity: 0; } }
.cell.d span { position: relative; z-index: 1; color: #fff; text-shadow: 0 1px 0 var(--ol), 0 0 3px var(--ol); }
.cell.free { background: linear-gradient(180deg, var(--gold1), var(--gold2)); box-shadow: inset 0 0 0 1.5px var(--gold3); font-size: 5.6cqw; }
.cell.no { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.cell.win { box-shadow: 0 0 0 2px var(--gold2), 0 0 12px rgba(247,185,36,.9); }
.bingo-btn { margin: 0 2.5cqw 2.5cqw; padding: 1.6cqw; font-size: 7cqw; border-radius: 3.5cqw; border-width: 2.5px; box-shadow: 0 3px 0 var(--ol), inset 0 2px 0 rgba(255,255,255,.55); }
.bingo-btn.no { animation: shake .3s; }
.won { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(61,26,79,.35); pointer-events: none; animation: fade .3s; }
.won div { text-align: center; padding: 3cqw 6cqw; border-radius: 5cqw; background: linear-gradient(180deg, var(--gold1), var(--gold2)); border: 3px solid var(--ol); box-shadow: 0 4px 0 var(--ol); animation: popIn .4s cubic-bezier(.2,.9,.3,1.4); }
.won b { display: block; font-size: 13cqw; line-height: 1; color: var(--ink); }
.won small { font-weight: 700; font-size: 5cqw; }
.countdown { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(61,26,79,.45); z-index: 25; }
.countdown b { font-size: 34vh; font-weight: 700; animation: popIn .5s; }

/* ---------- results ---------- */
#results { display: grid; place-items: center; padding: 10px; background: radial-gradient(70% 90% at 50% 10%, #fff6d8, #ffd1e0 55%, #c7a2f5); }
#results .panel { width: min(820px, 100%); grid-template-columns: minmax(200px, 34%) 1fr; align-items: start; }
.res-l { display: grid; gap: 10px; text-align: center; }
.res-l h2 { margin: 0; font-size: clamp(34px, 11vh, 52px); line-height: 1; }
.res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.res-stats div { border-radius: 14px; background: #fff; border: 2px solid #ead6b2; padding: 6px 2px; display: grid; font-size: 11px; color: var(--mist); font-weight: 600; }
.res-stats b { font-size: 22px; color: var(--ink); }
.res-r { display: grid; gap: 8px; min-width: 0; }
.res-r h4 { margin: 0; font-size: 16px; }
.got { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.got .cf { width: 108px; flex: none; animation: flip .6s both; }
@keyframes flip { from { transform: perspective(600px) rotateY(90deg); opacity: 0; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 14px; background: #fff; border: 2px solid #ead6b2; font-weight: 600; font-size: 13px; }
.chip i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(61,26,79,.3); }
.chip svg { width: 20px; height: 20px; }
.res-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.res-btns .b3 { padding: 7px 12px; font-size: 15px; }

/* ---------- album ---------- */
#album { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.14) 0 3px, transparent 4px) 0 0 / 46px 46px, linear-gradient(160deg, #8a5cf0, #5b2fc4 60%, #3d1a8f); color: #fff; display: grid; grid-template-rows: auto 1fr; }
.al-top { display: flex; align-items: end; gap: 12px; padding: max(8px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; }
.al-tab { padding: 8px 16px 6px; border-radius: 16px 16px 0 0; border: 3px solid var(--ol); border-bottom: 0; font-weight: 700; font-size: 17px; line-height: 1.05; text-align: center; }
.al-tab.on { background: linear-gradient(180deg, var(--gold1), var(--gold2)); color: var(--ink); text-shadow: none; }
.al-tab.off { background: linear-gradient(180deg, #c49cff, #8a55e8); opacity: .9; }
.al-tab small { display: block; font-size: 11px; color: #fff3b0; }
.al-mid { flex: 1; display: grid; justify-items: center; gap: 3px; padding-bottom: 8px; min-width: 180px; }
.al-mid .pbar { width: min(300px, 100%); height: 18px; position: relative; }
.al-mid .pbar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); }
.al-mid small { font-weight: 600; color: #e9dcff; font-size: 12px; }
.al-days { margin-bottom: 8px; padding: 3px 12px; border-radius: 14px; background: rgba(30,10,60,.6); border: 2px solid var(--ol); font-weight: 700; font-size: 14px; }
.al-body { color: var(--ink); border-top: 4px solid var(--ol); overflow-y: auto; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 20px max(14px, env(safe-area-inset-left, 0px));
  background: repeating-linear-gradient(90deg, #fff4f7 0 26px, #ffe3ec 26px 52px); }
.medals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 10px; max-width: 760px; margin: 0 auto; }
.medal { display: grid; justify-items: center; }
.medal .ring { width: min(100px, 20vh); aspect-ratio: 4 / 5; border-radius: 50px 50px 12px 12px; padding: 6px; background: linear-gradient(180deg, #c9a2ff, var(--plum2)); border: 3px solid var(--ol); box-shadow: 0 4px 0 var(--ol); box-sizing: border-box; }
.medal .ring > div { width: 100%; height: 100%; border-radius: 44px 44px 7px 7px; overflow: hidden; border: 2px solid rgba(61,26,79,.5); display: grid; place-items: center; }
.medal .ring svg { width: 72%; height: auto; }
.medal .ban { margin-top: -10px; position: relative; padding: 2px 12px 4px; border-radius: 6px; background: linear-gradient(180deg, #ffe58f, #f7b924); border: 3px solid var(--ol); color: var(--ink); font-weight: 700; font-size: 14px; white-space: nowrap; }
.medal .st { margin-top: 2px; font-weight: 700; font-size: 13px; }
.medal .st svg { width: 26px; height: 26px; }
.set-view { display: grid; gap: 10px; max-width: 980px; margin: 0 auto; }
.set-view .hd { display: flex; align-items: center; gap: 10px; }
.set-view h3 { margin: 0; font-size: 24px; flex: 1; }
.cards9 { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; }
.set-note { text-align: center; font-weight: 600; color: var(--ink); font-size: 13px; }

/* album card face */
.cf { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; padding: 6% 5% 5%; background: var(--paper); color: var(--ink); display: grid; grid-template-rows: 1fr auto; justify-items: center; text-align: center; border: 2.5px solid var(--ol); box-shadow: 0 3px 0 var(--ol); overflow: hidden; width: 100%; box-sizing: border-box; container-type: inline-size; }
.cf .bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, var(--tintL) 0 34%, transparent 35%); }
.cf .art { position: relative; width: 70%; align-self: center; color: var(--tint); }
.cf .art svg { width: 100%; height: auto; display: block; }
.cf .nm { position: relative; font-weight: 700; font-size: 13cqw; line-height: 1.05; text-wrap: balance; }
.cf .no { position: absolute; top: 3%; left: 6%; font-size: 10cqw; font-weight: 700; color: var(--tint); }
.cf .cnt { position: absolute; top: 3%; right: 3%; padding: 0 5px; border-radius: 9px; background: var(--plum2); color: #fff; font-size: 10cqw; font-weight: 700; border: 1.5px solid var(--ol); }
.cf .new { position: absolute; top: 3%; right: 3%; padding: 0 5px; border-radius: 9px; background: var(--rose); color: #fff; font-size: 10cqw; font-weight: 700; border: 1.5px solid var(--ol); }
.cf.gold { background: linear-gradient(160deg, #fff8dc, #ffdf7e 50%, #fff4cf); border-color: #8a5a00; }
.cf.gold::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%); background-size: 250% 100%; animation: foil 3.2s ease-in-out infinite; pointer-events: none; }
@keyframes foil { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.cf .star { position: absolute; bottom: 3%; right: 6%; color: #b07a12; font-size: 11cqw; }
.cf.miss { background: rgba(255,255,255,.55); border: 2.5px dashed rgba(61,26,79,.45); box-shadow: none; color: var(--mist); }
.cf.miss .bg { display: none; }
.cf.miss .art { opacity: .22; color: var(--ink); }
.cf.miss .no { color: var(--mist); }
.cf.miss::after { display: none; }

/* ---------- misc ---------- */
#toast { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; max-width: min(520px, 86vw); padding: 8px 16px; border-radius: 14px; background: linear-gradient(180deg, var(--plum1), var(--plum2)); border: 3px solid var(--ol); box-shadow: 0 4px 0 var(--ol); color: #fff; font-weight: 600; text-align: center; animation: popIn .25s; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 55; width: 100%; height: 100%; }
.float { position: fixed; z-index: 56; pointer-events: none; font-weight: 700; font-size: 17px; animation: floatUp 1s ease-out forwards; }
@keyframes floatUp { to { transform: translateY(-46px); opacity: 0; } }
#rotate { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; text-align: center; padding: 24px; background: radial-gradient(70% 60% at 50% 30%, #fff6d8, #ffd1e0 50%, #b78cf2); }
#rotate .in { display: grid; justify-items: center; gap: 14px; max-width: 320px; }
#rotate .ph { width: 70px; height: 116px; border-radius: 14px; border: 5px solid var(--ol); background: linear-gradient(180deg, #fff, #f3e3c8); animation: turn 2.2s ease-in-out infinite; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
#rotate b { font-size: 24px; }
#rotate p { margin: 0; color: var(--ink); line-height: 1.45; }
@media (orientation: portrait) and (max-width: 820px) { #rotate { display: grid; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

function updateMinis() { if (!R) return; R.els.forEach(function (e, i) { e.classList.toggle('ready', !!(e.parentNode && e.parentNode.classList.contains('minis') && !R.cards[i].won && bingoReady(R.cards[i]))); }); }
function hintUi() {
  if (!R || !R.alert) return;
  R.els.forEach(function (e, ci) {
    var k = R.cards[ci]; if (k.won) return;
    k.cells.forEach(function (c, i) { if (!c.d && R.called[c.n]) { var el = e.querySelector('[data-i="' + i + '"]'); if (el) el.classList.add('hint'); } });
  });
}
function useAlert() {
  if (!R || !R.active) { toast('Wait for the first ball, then turn on Bloom Alert.'); return; }
  if (R.alert) { toast('Bloom Alert is already on for this round.'); return; }
  if (S.alerts < 1) { toast('No Bloom Alerts left. Win more from treasure squares, bingos, level-ups and the daily gift.', 3600); return; }
  S.alerts--; save(); R.alert = true; this.classList.add('on'); $('#nAlert').textContent = S.alerts; SFX.boost(); hintUi();
  toast('Bloom Alert is on: called numbers on your cards will glow.');
}
function autoDaub(n) {
  if (!R || !R.active) return;
  R.els.forEach(function (e, ci) {
    var k = R.cards[ci]; if (k.won) return;
    k.cells.forEach(function (c, i) { if (c.n === n && !c.d) daub(ci, i, e.querySelector('[data-i="' + i + '"]')); });
  });
}
function fitCards() {
  var area = $('.bigs'); if (!area || !R) return;
  var n = Math.min(2, R.cards.length), gap = 10, W = area.clientWidth, H = area.clientHeight;
  area.style.setProperty('--cw', Math.floor(Math.min((W - gap * (n - 1)) / n, (H - 8) / 1.33)) + 'px');
}
function cardHtml(k, ci) {
  return '<div class="bcard" data-c="' + ci + '"><div class="hdr">' + COLS.map(function (l) { return '<span>' + l + '</span>'; }).join('') + '</div>' +
    '<div class="grid">' + k.cells.map(function (c, i) {
      if (i === 12) return '<div class="cell free d" aria-label="Free">FREE</div>';
      return '<button class="cell" data-i="' + i + '" aria-label="' + letter(c.n) + ' ' + c.n + '"><span>' + c.n + '</span>' + (c.t ? '<svg class="tr" viewBox="0 0 40 40"><use href="#t-' + c.t + '"/></svg>' : '') + '</button>';
    }).join('') + '</div><button class="b3 gold bingo-btn" data-b="' + ci + '">BINGO!</button></div>';
}
function callNext() {
  if (!R || !R.active || R.paused) return;
  if (R.idx >= R.seq.length) return;
  var n = R.seq[R.idx++]; R.called[n] = true;
  R.recent.unshift(n); R.recent = R.recent.slice(0, 5);
  var b = $('#ball'); b.style.setProperty('--bc', ballColor(n)); b.innerHTML = '<div class="in"><small>' + letter(n) + '</small><b>' + n + '</b></div>';
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  $('#recent').innerHTML = R.recent.slice(1).map(function (x) { return '<span style="--bc:' + ballColor(x) + '">' + x + '</span>'; }).join('');
  $('#sBalls').textContent = R.idx + '/' + BALLS;
  SFX.ball(); say(letter(n) + ' ' + n);
  hintUi();
  if (S.settings.auto) setTimeout(function () { autoDaub(n); }, 450);
  rivals();
  if (!R.active) return;
  if (R.idx >= R.seq.length) { toast('Last ball! Mark your numbers and call your bingos.'); R.timer = setTimeout(function () { endRound('balls'); }, 6000); }
  else R.timer = setTimeout(callNext, speedMs());
}
function rivals() {
  if (R.idx < 9 || R.left <= 0) return;
  var p = Math.min(.55, .07 + (R.idx - 9) * .017);
  if (Math.random() < p) {
    R.left--; $('#sLeft').textContent = R.left;
    $('#sLeftW').classList.toggle('hot', R.left <= 3);
    if (R.left === 0) { toast('All bingos have been claimed'); R.active = false; clearTimeout(R.timer); setTimeout(function () { endRound('claimed'); }, 1600); }
  }
}
function onCardTap(e) {
  var bb = e.target.closest('[data-b]');
  if (bb) { claim(+bb.dataset.b, bb); return; }
  var mini = e.target.closest('.minis .bcard'); if (mini) { swapCards(); return; }
  var cell = e.target.closest('.cell[data-i]'); if (!cell || !R || !R.active || R.paused) return;
  var ci = +cell.closest('.bcard').dataset.c, k = R.cards[ci], c = k.cells[+cell.dataset.i];
  if (k.won || c.d) return;
  if (!R.called[c.n]) { cell.classList.remove('no'); void cell.offsetWidth; cell.classList.add('no'); SFX.no(); return; }
  daub(ci, +cell.dataset.i, cell);
}
function daub(ci, i, cell) {
  var c = R.cards[ci].cells[i]; c.d = true;
  cell.classList.add('d'); cell.classList.remove('hint');
  var tr = cell.querySelector('.tr'); if (tr) tr.remove();
  cell.insertAdjacentHTML('afterbegin', '<svg class="bl" viewBox="0 0 100 100" aria-hidden="true"><use href="#bloom"/></svg>');
  SFX.daub(); addXp(2);
  if (c.t) collect(c, cell);
  R.meter = Math.min(BOOST_AT, R.meter + 1); meterUi(); updateMinis();
}
function collect(c, cell) {
  if (c.t === 'coins') { var cc = 10 * R.bet; S.coins += cc; R.earned.coins += cc; floatText(cell, '+' + cc + ' coins'); SFX.coin(); }
  if (c.t === 'alert') { S.alerts++; R.earned.alerts++; floatText(cell, 'Bloom Alert!'); SFX.coin(); var na = $('#nAlert'); if (na) na.textContent = S.alerts; }
  if (c.t === 'petal') { S.petals += 2; R.earned.petals += 2; floatText(cell, '+2 petals'); SFX.coin(); }
  if (c.t === 'card') { var d = dropCard(); R.earned.cards.push(d); R.earned.sets = R.earned.sets.concat(d.sets); floatText(cell, 'Album card!'); }
  if (c.t === 'ing') { var g = dropIng(); R.earned.ings.push(g); floatText(cell, '+1 ' + ingById(g).name); }
  c.t = null; statsUi(); save();
}
function meterUi() { $('#meter').style.width = (R.meter / BOOST_AT * 100) + '%'; $('#bBoost').disabled = R.meter < BOOST_AT || !R.active; }
function statsUi() { var w = $('#sCoins'); if (w) w.textContent = R.earned.coins; var p = $('#sPetals'); if (p) p.textContent = R.earned.petals; }
function useBoost(e) {
  if (!R || !R.active || R.meter < BOOST_AT) return;
  R.meter = 0; SFX.boost(); sparkle(e.clientX, e.clientY, 30);
  R.cards.forEach(function (k, ci) {
    if (k.won) return;
    var open = k.cells.map(function (c, i) { return i; }).filter(function (i) { return !k.cells[i].d; });
    shuffle(open).slice(0, 2).forEach(function (i) { daub(ci, i, $('.bcard[data-c="' + ci + '"] .cell[data-i="' + i + '"]')); });
  });
  R.meter = 0; meterUi();
  toast('Bloom Boost: 2 free marks on each card');
}
function claim(ci, btn) {
  if (!R || !R.active) return;
  var k = R.cards[ci]; if (k.won) return;
  var line = null;
  for (var j = 0; j < LINES.length; j++) { if (LINES[j].every(function (i) { return k.cells[i].d; })) { line = LINES[j]; break; } }
  if (!line) { btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no'); SFX.no(); toast('No bingo on this card yet. You need 5 in a row or the 4 corners.'); return; }
  k.won = true;
  var coins = Math.round((30 + 90 * (R.left / R.total)) * R.bet), petals = 2 + R.bet;
  R.left = Math.max(0, R.left - 1); $('#sLeft').textContent = R.left;
  R.bingos++; S.coins += coins; R.earned.coins += coins; S.petals += petals; R.earned.petals += petals;
  var d = dropCard(); R.earned.cards.push(d); R.earned.sets = R.earned.sets.concat(d.sets);
  R.earned.ings.push(dropIng()); addXp(25);
  if (Math.random() < .3) { S.alerts++; R.earned.alerts++; var na = $('#nAlert'); if (na) na.textContent = S.alerts; }
  statsUi(); save();
  var cardEl = btn.closest('.bcard');
  line.forEach(function (i) { var el = cardEl.querySelector('[data-i="' + i + '"]'); if (el) el.classList.add('win'); });
  cardEl.insertAdjacentHTML('beforeend', '<div class="won"><div><b>Bingo!</b><small>+' + coins + ' coins · +' + petals + ' petals</small></div></div>');
  btn.disabled = true; updateMinis();
  SFX.bingo(); say('Bingo!');
  var r = cardEl.getBoundingClientRect(); sparkle(r.left + r.width / 2, r.top + r.height / 2, 70);
  if (R.cards.every(function (x) { return x.won; })) { R.active = false; clearTimeout(R.timer); setTimeout(function () { endRound('done'); }, 1800); }
  else if (R.left === 0) { R.active = false; clearTimeout(R.timer); setTimeout(function () { endRound('claimed'); }, 1800); }
}
function togglePause() {
  if (!R) return;
  if (!R.paused && !R.active) return;
  R.paused = !R.paused;
  $('#bPause').innerHTML = R.paused ? LINE_ICON.play : LINE_ICON.pause;
  if (R.paused) { clearTimeout(R.timer); toast('Paused. Tap play to continue.', 1800); }
  else if (R.idx < R.seq.length) R.timer = setTimeout(callNext, 600);
  else R.timer = setTimeout(function () { endRound('balls'); }, 3000);
}
function stopRound() { if (R) { clearTimeout(R.timer); R.active = false; } try { if (wake) wake.release(); } catch (e) { /* fine */ } wake = null; }
function endRound(why) {
  if (!R || R.ended) return;
  R.ended = true; stopRound();
  S.stats.rounds++; S.stats.bingos += R.bingos;
  logEvent({ t: 'round', room: 'paris', cards: R.cards.length, bingos: R.bingos, coins: R.earned.coins, petals: R.earned.petals });
  save();
  if (why === 'quit') { R = null; lobby(); return; }
  results();
}

function results() {
  var E = R.earned, head = R.bingos ? (R.bingos > 1 ? R.bingos + ' Bingos!' : 'Bingo!') : 'Round over';
  var ingCount = {}; E.ings.forEach(function (g) { ingCount[g] = (ingCount[g] || 0) + 1; });
  show('<div class="screen" id="results"><div class="panel">' +
    '<div class="res-l"><h2 class="outl">' + head + '</h2><p>' + (R.bingos ? 'Beautifully played.' : 'No bingo this time. More cards give more chances.') + '</p>' +
      '<div class="res-stats"><div><b>' + R.bingos + '</b>Bingos</div><div><b>' + E.coins + '</b>Coins</div><div><b>' + E.petals + '</b>Petals</div></div>' +
      '<div class="res-btns" style="justify-content:center"><button class="b3 gold" id="bAgain">Play again</button><button class="b3 cream" id="bLobby">Map</button><button class="b3 plum" id="bAlb">Album</button></div></div>' +
    '<div class="res-r">' +
      (E.sets.length ? '<h4>Set complete: ' + E.sets.map(function (id) { return setById(id).name; }).join(', ') + ' · +' + SET_REWARD * E.sets.length + ' coins</h4>' : '') +
      '<h4>New for your album (' + E.cards.length + ')</h4>' +
      (E.cards.length ? '<div class="got">' + E.cards.map(function (d, i) { return cardFace(d.id, { isNew: d.isNew, hideCount: true, delay: .15 + i * .18 }); }).join('') + '</div>' : '<p>Win a bingo or find a card square to get album cards.</p>') +
      '<h4>For your pantry</h4>' +
      (E.ings.length ? '<div class="chips">' + Object.keys(ingCount).map(function (id) { var g = ingById(id); return '<span class="chip"><i style="background:' + g.c + '"></i>' + g.name + ' <b>+' + ingCount[id] + '</b></span>'; }).join('') + '</div>' : '<p>No ingredients this round.</p>') +
      (E.alerts ? '<p>+' + E.alerts + ' Bloom Alert' + (E.alerts > 1 ? 's' : '') + ' won. You have ' + S.alerts + '.</p>' : '') +
      (E.petals ? '<p>You have <b>' + S.petals + ' petals</b>. Spend them on the map to build Paris.</p>' : '') +
    '</div></div></div>');
  if (R.bingos) setTimeout(function () { sparkle(innerWidth * .25, 80, 90); SFX.set(); }, 250);
  $('#bAgain').onclick = pickCards;
  $('#bLobby').onclick = lobby; $('#bAlb').onclick = function () { album(null); };
  R = null;
}

function daysLeft() { return Math.max(0, ALBUM_DAYS - Math.floor((Date.now() - S.albumStart) / 86400000)); }
function album(setIdx) {
  var total = ownedAll();
  var top = '<div class="al-top"><div class="al-tab on outl">Paris<br>Album</div><button class="al-tab off outl" id="bSpecial">Special<small>coming soon</small></button>' +
    '<div class="al-mid"><small>Complete all sets to win ' + ALBUM_REWARD.toLocaleString() + ' coins</small><div class="pbar"><i style="width:' + (total / 72 * 100) + '%"></i><span>' + total + '/72</span></div></div>' +
    '<span class="al-days">' + daysLeft() + ' days</span><button class="x" id="bClose" style="position:static" aria-label="Back to map">✕</button></div>';
  var body;
  if (setIdx === null) {
    body = '<div class="medals">' + SETS.map(function (s, i) {
      var own = ownedIn(s), done = !!S.setsDone[s.id];
      return '<button class="medal" data-s="' + i + '"><span class="ring"><div style="background:radial-gradient(circle at 50% 35%, ' + s.bg[0] + ', ' + s.bg[1] + ')"><svg viewBox="0 0 48 40" style="color:' + s.tint + '"><use href="#m-' + s.id + '"/></svg></div></span>' +
        '<span class="ban">' + s.name + '</span><span class="st">' + (done ? '<svg viewBox="0 0 40 40"><use href="#i-check"/></svg>' : '<span class="outl">' + own + '/9</span>') + '</span></button>';
    }).join('') + '</div>';
  } else {
    var set = SETS[setIdx], own = ownedIn(set);

      '<div class="cards9">' + set.cards.map(function (n, i) { return '<button data-id="' + set.id + '|' + (i + 1) + '">' + cardFace(set.id + '|' + (i + 1)) + '</button>'; }).join('') + '</div>' +
      '<p class="set-note">' + (S.setsDone[set.id] ? 'Set complete! Extra copies (+1, +2) can be sent to teammates in the team version.' : 'Finish this set for ' + SET_REWARD + ' coins. ★ Gold cards are rarer.') + '</p></div>';
  }
  show('<div class="screen" id="album">' + top + '<div class="al-body">' + body + '</div></div>');
  $('#bClose').onclick = lobby;
  $('#bSpecial').onclick = function () { toast('The Special album is coming soon.'); };
  app.querySelectorAll('.medal').forEach(function (b) { b.onclick = function () { SFX.tap(); album(+b.dataset.s); }; });
  if ($('#bSets')) $('#bSets').onclick = function () { album(null); };
  app.querySelectorAll('.cards9 button').forEach(function (b) {
    b.onclick = function () {
      var id = b.dataset.id, n = S.album[id] || 0, ci = cardInfo(id);
      if (!n) { toast('Not found yet. Win bingos to find ' + (ci.gold ? 'this gold card' : 'this card') + '.'); return; }
      panel('<div style="display:grid;grid-template-columns:min(150px,30vh) 1fr;gap:16px;align-items:center">' + cardFace(id) +
        '<div style="display:grid;gap:8px"><h3>' + esc(ci.name) + '</h3><p>' + ci.set.name + ' set · card ' + (ci.idx + 1) + (ci.gold ? ' · ★ Gold' : '') + '</p><p>You have <b>' + n + '</b>' + (n > 1 ? ' (' + (n - 1) + ' extra to share)' : '') + '.</p></div></div>', 'small');
    };
  });
}

/* ---------- start ---------- */
document.addEventListener('visibilitychange', function () { if (document.hidden && R && R.active && !R.paused) togglePause(); });
function boot(data) {
  load();
  if (data && data.save) S = merge(data.save);
  save();
  title();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(function () { return { save: S }; }); } catch (e) { /* fine */ } }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);

})();
