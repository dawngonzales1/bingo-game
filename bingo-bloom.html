<title>Bingo Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: played sideways. A sunny little Paris you build up (the lobby map), with chunky glossy plum-and-gold buttons laid over it. */
:root {
  --ol: #3d1a4f;            /* chunky outline, dark plum */
  --ink: #3d1a4f;
  --plum1: #b07cff; --plum2: #7b3fe0; --plum3: #4f1fa3;
  --gold1: #ffe58f; --gold2: #f7b924; --gold3: #c98a0b;
  --cream: #fff7e8; --paper: #fffdf7; --sand: #f3dcae;
  --rose: #ff8fb1; --green1: #8ff07a; --green2: #3fb43a; --sky: #8fd8f0;
  --mist: #8a6f9c;
  --ui: 'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: #f0d7a6; color: var(--ink); font-family: var(--ui); font-weight: 500; font-size: 15px; overflow: hidden; -webkit-font-smoothing: antialiased; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; }

/* text with a chunky outline */
.outl { color: #fff; text-shadow: 0 2px 0 var(--ol), 2px 0 0 var(--ol), -2px 0 0 var(--ol), 0 -2px 0 var(--ol), 1.5px 1.5px 0 var(--ol), -1.5px 1.5px 0 var(--ol), 1.5px -1.5px 0 var(--ol), -1.5px -1.5px 0 var(--ol), 0 4px 0 var(--ol); }

/* glossy 3D buttons */
.b3 { position: relative; border: 3px solid var(--ol); border-radius: 18px; font-weight: 700; letter-spacing: .02em; box-shadow: 0 5px 0 var(--ol), inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.12); transition: transform .08s, box-shadow .08s; }
.b3:not(:disabled):active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ol), inset 0 3px 0 rgba(255,255,255,.55); }
.b3:disabled { filter: saturate(.25) brightness(.95); cursor: default; }
.b3.gold { background: linear-gradient(180deg, var(--gold1), var(--gold2) 60%, #f0a40f); color: var(--ink); }
.b3.plum { background: linear-gradient(180deg, var(--plum1), var(--plum2) 60%, var(--plum3)); color: #fff; }
.b3.green { background: linear-gradient(180deg, var(--green1), var(--green2)); color: #fff; }
.b3.cream { background: linear-gradient(180deg, #fff, #f6e7cc); color: var(--ink); }

/* ---------- title ---------- */
#title { display: grid; place-items: center; overflow: hidden; background: var(--plum3); }
#title .tbg { position: absolute; inset: -4%; background: url(art/room-paris.webp) 30% center / cover no-repeat; filter: blur(3px) saturate(1.1); animation: kb 30s ease-in-out infinite alternate; }
#title .tbg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 70% at 50% 45%, rgba(61,26,79,.1), rgba(61,26,79,.55) 70%, rgba(40,12,58,.85)); }
@keyframes kb { to { transform: scale(1.08) translateX(-2%); } }
.tfall { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tfall img { position: absolute; top: -50px; opacity: .9; animation-name: fall, sway; animation-timing-function: linear, ease-in-out; animation-iteration-count: infinite; animation-direction: normal, alternate; filter: drop-shadow(0 3px 3px rgba(61,26,79,.3)); }
@keyframes fall { to { top: 105%; } }
@keyframes sway { from { transform: translateX(-26px) rotate(-30deg); } to { transform: translateX(26px) rotate(40deg); } }
#title .in { position: relative; display: grid; justify-items: center; text-align: center; padding: 0 16px; }
.tball { width: clamp(64px, 20vh, 120px); height: auto; margin-bottom: -2vh; filter: drop-shadow(0 8px 10px rgba(30,8,45,.45)); animation: bob 2.4s ease-in-out infinite; }
.logo { position: relative; margin: 0; font-family: var(--ui); font-weight: 700; font-size: clamp(46px, min(19vh, 13vw), 112px); line-height: 1.05; letter-spacing: .01em; white-space: nowrap; }
.logo::before { content: attr(data-t); position: absolute; inset: 0; color: var(--ol); -webkit-text-stroke: .2em var(--ol); text-shadow: 0 .1em 0 var(--ol), 0 .18em .25em rgba(20,5,30,.5); z-index: 0; }
.logo span { position: relative; z-index: 1; background: linear-gradient(180deg, #fffdf0 8%, #ffe680 40%, #f7b924 58%, #ffd95a 78%, #e9940f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.by { margin: -.2em 0 clamp(10px, 5vh, 26px); padding: 3px 26px 4px; position: relative; background: linear-gradient(180deg, var(--plum1), var(--plum2)); border: 3px solid var(--gold2); box-shadow: 0 0 0 3px var(--ol), 0 5px 0 3px var(--ol); border-radius: 6px; }
.by span { font-family: var(--display); font-style: italic; font-weight: 700; font-size: clamp(16px, 6vh, 26px); color: #fff4c9; letter-spacing: .04em; text-shadow: 0 2px 0 var(--ol); }
.shine { overflow: hidden; }
.shine::after { content: ''; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-20deg); animation: sweep 2.8s ease-in-out infinite; }
@keyframes sweep { 0%, 55% { left: -60%; } 100% { left: 130%; } }
.tfoot { margin: clamp(8px, 4vh, 20px) 0 0; color: #fff4c9; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-shadow: 0 1px 2px var(--ol); opacity: .9; }
#title .b3 { font-size: clamp(24px, 9vh, 36px); padding: 6px 70px 8px; border-radius: 24px; }

.clouds { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.clouds i { position: absolute; width: 160px; height: 46px; border-radius: 40px; background: #fff; opacity: .85; animation: drift 38s linear infinite; }
.clouds i::before, .clouds i::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.clouds i::before { width: 70px; height: 70px; left: 24px; top: -36px; }
.clouds i::after { width: 54px; height: 54px; left: 78px; top: -24px; }
@keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(110vw); } }

/* ---------- map lobby ---------- */
#pathWrap { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; background: var(--plum3); scrollbar-width: none; cursor: grab; }
#pathWrap::-webkit-scrollbar { display: none; }
#pathIn { position: relative; height: 100%; }
.zone { position: absolute; top: 0; bottom: 0; background-size: cover; background-repeat: no-repeat; -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%); mask-image: linear-gradient(90deg, transparent, #000 30%); }
.zone.soonz { background: radial-gradient(ellipse at 40% 50%, #fff3d6, #f3c9e0 50%, #b48ce8); }
.trail { position: absolute; left: 0; top: 0; pointer-events: none; }
.trail path { fill: none; stroke-linecap: round; }
.trail .t1 { stroke: var(--ol); stroke-width: 34; opacity: .85; }
.trail .t2 { stroke: #f8dd94; stroke-width: 24; }
.trail .t3 { stroke: #fffbe8; stroke-width: 4; stroke-dasharray: 2 16; }
.stop { position: absolute; width: 0; height: 0; display: block; }
.stop > * { position: absolute; left: 0; transform: translateX(-50%); }
.stop .med { --m: clamp(92px, 36vh, 168px); top: calc(var(--m) / -2); width: var(--m); height: var(--m); border-radius: 50%; background-size: cover; background-color: #ead7ff; border: 5px solid var(--gold2); box-shadow: 0 0 0 4px var(--ol), 0 8px 0 4px var(--ol), 0 14px 24px rgba(30,8,45,.45), inset 0 0 0 3px rgba(255,255,255,.6); display: grid; place-items: center; transition: transform .15s; }
.stop:active .med { transform: translateX(-50%) scale(.95); }
.stop .stag { top: calc(clamp(92px, 36vh, 168px) / -2 - 12px); white-space: nowrap; padding: 2px 10px; border-radius: 10px; background: linear-gradient(180deg, var(--green1), var(--green2)); border: 2.5px solid var(--ol); color: #fff; font-weight: 700; font-size: 11px; text-shadow: 0 1px 0 var(--ol); }
.stop .sname { top: calc(clamp(92px, 36vh, 168px) / 2 + 2px); white-space: nowrap; padding: 2px 16px 3px; border-radius: 12px; background: linear-gradient(180deg, var(--plum1), var(--plum2)); border: 3px solid var(--ol); box-shadow: 0 3px 0 var(--ol); font-size: clamp(14px, 5vh, 19px); font-weight: 700; text-shadow: 0 2px 0 var(--ol); color: #fff; }
.stop .sfoot { top: calc(clamp(92px, 36vh, 168px) / 2 + clamp(28px, 9vh, 36px)); white-space: nowrap; padding: 0 8px; border-radius: 8px; background: rgba(61,26,79,.8); color: #fff4c9; font-size: 11px; font-weight: 600; }
.stop .pin { top: calc(clamp(92px, 36vh, 168px) / -2 - 50px); width: 38px; height: 38px; animation: bob 1.2s ease-in-out infinite; filter: drop-shadow(0 3px 2px rgba(30,8,45,.4)); }
.stop .pin svg { width: 100%; height: 100%; }
.stop.soon .med { background: radial-gradient(circle at 40% 30%, #fff, #e2d3f7); }
.stop.soon .med svg { width: 40%; height: 40%; opacity: .6; }
.stop.soon .sname { background: linear-gradient(180deg, #b9a7cf, #8c76a8); }
#cityScr .hud-top { gap: 10px; }
.chint { padding: 3px 12px; border-radius: 12px; background: rgba(61,26,79,.8); color: #fff; font-size: 12px; font-weight: 600; }
button.city { text-align: left; color: var(--ink); font: inherit; }
#mapWrap { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; background: radial-gradient(ellipse at center, #fbefcb, #f1d99c); scrollbar-width: none; cursor: grab; }
#mapWrap::-webkit-scrollbar { display: none; }
#mapSvg { display: block; height: 100%; margin: 0 84px 0 76px; }
.lm { cursor: pointer; }
.lm:active { filter: brightness(1.08); }
.twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 50% { transform: scale(.4); opacity: .3; } }
.bounce { animation: bob 1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.wave { stroke-dasharray: 14 30; animation: flow 3s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -88; } }
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-top { top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.lvl { display: flex; align-items: center; }
.lvl .badge { position: relative; z-index: 1; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 30%, var(--plum1), var(--plum3)); border: 3px solid var(--gold2); box-shadow: 0 0 0 3px var(--ol); font-weight: 700; font-size: 20px; }
.lvl .badge small { text-shadow: none; position: absolute; bottom: -9px; padding: 0 6px; border-radius: 8px; background: var(--gold2); color: var(--ink); font-size: 10px; border: 2px solid var(--ol); line-height: 1.3; }
.lvl .xp { margin-left: -12px; width: 108px; height: 18px; border-radius: 10px; background: rgba(61,26,79,.75); border: 2.5px solid var(--ol); overflow: hidden; position: relative; }
.lvl .xp i { display: block; height: 100%; background: linear-gradient(180deg, #ffe58f, #f7b924); }
.lvl .xp span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 var(--ol); }
.cur { display: flex; align-items: center; height: 32px; padding: 0 12px 0 0; border-radius: 18px; background: rgba(61,26,79,.78); border: 2.5px solid var(--ol); color: #fff; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.cur .ic { width: 36px; height: 36px; margin: -4px 6px -4px -8px; flex: none; }
.spacer { flex: 1; }
.round { position: relative; display: grid; justify-items: center; gap: 0; width: 64px; padding-bottom: 14px; }
.round .c { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--ol); box-shadow: 0 4px 0 var(--ol), inset 0 3px 0 rgba(255,255,255,.5); background: radial-gradient(circle at 40% 30%, #9fe8ff, #2f9fe0); position: relative; }
.round .c svg { width: 34px; height: 34px; }
.round .c.pl { background: radial-gradient(circle at 40% 30%, var(--plum1), var(--plum3)); }
.round .c.gd { background: radial-gradient(circle at 40% 30%, #fff1b0, var(--gold2)); }
.round .c.pk { background: radial-gradient(circle at 40% 30%, #ffd0e0, #ff6f9d); }
.round .lb { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 1; padding: 0 7px; border-radius: 9px; background: rgba(61,26,79,.85); color: #fff; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.round .dot { position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: #ff4d6d; border: 2.5px solid #fff; }
.round:active .c { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }
.hud-left { left: max(10px, env(safe-area-inset-left, 0px)); top: calc(74px + env(safe-area-inset-top, 0px)); display: grid; gap: 4px; }
.hud-right { right: max(10px, env(safe-area-inset-right, 0px)); top: calc(66px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; }
.hud-play { right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.hud-play .b3 { font-size: 30px; padding: 8px 34px 10px; border-radius: 22px; display: grid; line-height: 1; }
.hud-play .b3 small { font-size: 12px; font-weight: 600; letter-spacing: .04em; margin-top: 2px; }
.city { display: grid; gap: 2px; min-width: 120px; padding: 3px 10px 5px; border-radius: 14px; background: rgba(255,247,232,.94); border: 2.5px solid var(--ol); }
.city b { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; line-height: 1.2; }
.city .pbar { height: 9px; }
.pbar { height: 12px; border-radius: 7px; background: #e6d5b8; border: 2px solid var(--ol); overflow: hidden; }
.pbar i { display: block; height: 100%; background: linear-gradient(180deg, #ffe58f, #f7b924); }

/* ---------- panels and sheets ---------- */
.veil { position: fixed; inset: 0; z-index: 30; background: rgba(40,14,52,.55); display: grid; place-items: center; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.panel { position: relative; width: min(860px, 100%); max-height: 100%; box-sizing: border-box; border-radius: 26px; background: var(--cream); border: 4px solid var(--ol); box-shadow: 0 8px 0 var(--ol), inset 0 0 0 5px #f2dcae; padding: 16px 18px; display: grid; gap: 12px; overflow: auto; animation: popIn .28s cubic-bezier(.2,.9,.3,1.25); }
.panel.small { width: min(460px, 100%); }
.panel.mid { width: min(640px, 100%); }
@keyframes popIn { from { transform: scale(.88); opacity: 0; } }
.panel h3 { margin: 0; font-size: 26px; font-weight: 700; color: var(--ink); }
.panel p { margin: 0; line-height: 1.45; }
.panel ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; line-height: 1.4; }
.x { position: absolute; top: 8px; right: 10px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 30%, #ff9a9a, #e5383b); border: 3px solid var(--ol); box-shadow: 0 3px 0 var(--ol); color: #fff; font-size: 22px; font-weight: 700; z-index: 2; }
.tabs { display: flex; gap: 6px; }
.tabs button { padding: 6px 18px; border-radius: 14px 14px 6px 6px; border: 3px solid var(--ol); font-weight: 700; font-size: 17px; background: linear-gradient(180deg, #9db8ff, #4f74e0); color: #fff; text-shadow: 0 2px 0 var(--ol); }
.tabs button[aria-pressed="true"] { background: linear-gradient(180deg, var(--plum1), var(--plum2)); }
.posters { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x mandatory; }
.poster { flex: none; scroll-snap-align: start; width: min(200px, 30vh * 1.1); aspect-ratio: 3 / 4; border-radius: 18px; border: 4px solid var(--ol); overflow: hidden; position: relative; box-shadow: 0 5px 0 var(--ol); text-align: center; }
.poster svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.poster span.art { position: absolute; inset: 0; }
.poster .tag { position: absolute; top: 0; right: 0; padding: 3px 10px 4px 14px; border-radius: 0 0 0 14px; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 var(--ol); border-left: 3px solid var(--ol); border-bottom: 3px solid var(--ol); }
.poster .tag.new { background: linear-gradient(180deg, var(--green1), var(--green2)); }
.poster .tag.soon { background: linear-gradient(180deg, #9db8ff, #4f74e0); }
.poster .nm { position: absolute; left: 0; right: 0; top: 14%; font-size: clamp(20px, 6.6vh, 30px); font-weight: 700; line-height: .95; }
.poster .foot { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 4px; border-radius: 12px; background: rgba(61,26,79,.8); color: #fff; font-size: 12px; font-weight: 600; }
.poster.locked .art { filter: saturate(.35) brightness(.85); }
.poster .lock { position: absolute; left: 0; right: 0; bottom: 14px; display: grid; place-items: center; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pick { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border-radius: 18px; border: 3px solid var(--ol); background: #fff; box-shadow: 0 4px 0 var(--ol); font-weight: 700; }
.pick[aria-pressed="true"] { background: linear-gradient(180deg, #f3e8ff, #dcc4ff); box-shadow: 0 4px 0 var(--ol), inset 0 0 0 3px var(--plum2); }
.pick .mini { display: flex; gap: 3px; height: 34px; align-items: center; }
.pick .mini i { width: 22px; height: 28px; border-radius: 4px; background: linear-gradient(180deg, var(--plum2) 0 22%, var(--paper) 22%); border: 2px solid var(--ol); }
.pick small { font-size: 12px; color: var(--mist); font-weight: 600; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #fff; border: 2px solid #ead6b2; font-weight: 600; }
.sw { width: 54px; height: 32px; border-radius: 16px; background: #d9c8e8; border: 3px solid var(--ol); position: relative; flex: none; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--ol); transition: transform .18s; }
.sw[aria-pressed="true"] { background: var(--green2); }
.sw[aria-pressed="true"]::after { transform: translateX(22px); }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: #efe1c6; }
.seg button { padding: 5px 10px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--mist); }
.seg button[aria-pressed="true"] { background: var(--plum2); color: #fff; }

/* ---------- play ---------- */
#play { display: grid; grid-template-columns: minmax(150px, 23%) 1fr; grid-template-rows: minmax(0, 1fr); gap: 10px; padding: max(8px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.7) 0 2px, transparent 3px) 0 0 / 34px 34px, linear-gradient(135deg, #ffd8e6 0%, #ffeccc 55%, #d9f2ff 100%); }
.side { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; border-radius: 22px; padding: 8px; background: rgba(255,253,247,.92); border: 3px solid var(--ol); box-shadow: 0 5px 0 var(--ol); }
.side .row { display: flex; justify-content: space-between; align-items: center; }
.mini-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--ol); box-shadow: 0 3px 0 var(--ol); background: linear-gradient(180deg, #fff, #f1e2c6); }
.mini-btn svg { width: 20px; height: 20px; stroke: var(--ol); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.room-nm { font-weight: 700; font-size: 13px; text-align: center; line-height: 1.05; }
.ball { --s: min(80px, 20vh); width: var(--s); height: var(--s); margin: 0 auto; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--ol); flex: none;
  background: radial-gradient(circle at 35% 28%, #fff 0 14%, var(--bc, var(--gold1)) 55%, color-mix(in srgb, var(--bc, var(--gold2)) 62%, #000) 100%); box-shadow: 0 5px 0 var(--ol); }
.ball .in { width: 66%; height: 66%; border-radius: 50%; background: var(--paper); display: grid; place-items: center; align-content: center; line-height: 1; border: 2px solid rgba(61,26,79,.25); }
.ball .in small { font-size: calc(var(--s) * .14); font-weight: 700; }
.ball .in b { font-size: calc(var(--s) * .3); font-weight: 700; font-variant-numeric: tabular-nums; }
.ball.pop { animation: ballIn .5s cubic-bezier(.2,.9,.3,1.3); }
@keyframes ballIn { from { transform: translateX(-60px) rotate(-200deg) scale(.5); opacity: 0; } }
.recent { display: flex; justify-content: center; gap: 4px; min-height: 22px; }
.recent span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--bc); border: 2px solid var(--ol); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.stat { display: grid; padding: 3px 6px; border-radius: 10px; background: #f6ead3; font-size: 10.5px; font-weight: 600; color: var(--mist); line-height: 1.15; text-align: center; }
.stat b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat.hot b { color: #e5383b; }
.boost { margin-top: auto; display: grid; gap: 5px; }

.prearm { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.bcount { position: absolute; z-index: 3; top: 1.6cqw; right: 2cqw; padding: 0 2.4cqw; border-radius: 3cqw; background: linear-gradient(180deg, var(--gold1), var(--gold2)); border: 2px solid var(--ol); font-weight: 700; font-size: 6cqw; color: var(--ink); display: none; }

#play.m-blackout { background: linear-gradient(180deg, rgba(30,15,60,.05), rgba(30,15,60,.25)), url(art/room-midnight-garden.webp) center / cover no-repeat, #2c2160; }

/* featured rooms */

@keyframes flutter { from { transform: scaleX(1) translateY(0); } to { transform: scaleX(.8) translateY(-6%); } }

/* get ready, lucky card, ball timer, auto boost, round complete */

/* ---------- misc ---------- */

.float { position: fixed; z-index: 56; pointer-events: none; font-weight: 700; font-size: 17px; animation: floatUp 1s ease-out forwards; }

#play .grid { gap: 1.8cqw; padding: 1.6cqw 2.6cqw 2.8cqw; }

/* room path: whole paintings in gold frames */
.stop { --mh: clamp(78px, 31vh, 150px); --mw: calc(var(--mh) * 1360 / 768); }

.stop .sname { top: calc(var(--mh) / 2 + 4px); }
.stop .sfoot { top: calc(var(--mh) / 2 + clamp(30px, 9vh, 38px)); }

.stop.soon .med { background: radial-gradient(circle at 40% 30%, #fff, #e2d3f7); }
/* ===== lobby: one painted city with 4 rooms, featured rooms along the bottom ===== */

.citysec::before { content: ''; position: absolute; inset: -20px; background: url(art/lobby-paris-map.webp) center / cover; filter: blur(14px) brightness(.8) saturate(1.1); }
#worldWrap #mapSvg { position: relative; display: block; width: 100%; height: auto; margin: 0; border-radius: 0 0 22px 22px; box-shadow: 0 0 0 3px var(--gold2), 0 0 0 5px var(--ol), 0 12px 30px rgba(20,5,30,.5); }
#worldWrap .lm { cursor: pointer; }
.cityban { position: relative; display: grid; justify-items: center; margin: 10px auto 0; width: max-content; max-width: 90%; padding: 4px 40px 6px; text-align: center; background: linear-gradient(90deg, transparent, rgba(40,12,64,.85) 18%, rgba(40,12,64,.85) 82%, transparent); }
.cityban b { font-size: clamp(22px, 8vh, 36px); letter-spacing: .08em; line-height: 1.05; }
.cityban small { color: #ffe58f; font-weight: 600; font-size: 12px; }
.nextsec { position: relative; height: max(220px, 60vh); display: grid; place-items: center; background: radial-gradient(ellipse at 30% 40%, #fff 0 18%, transparent 40%), radial-gradient(ellipse at 70% 60%, #fff 0 20%, transparent 42%), radial-gradient(ellipse at 50% 20%, #f3e9ff 0 25%, transparent 50%), linear-gradient(180deg, #cdb6ef, #f2e9ff 40%, #e2d2fb); }
.nextsec .cityban { margin: 0; }
.hud-feat { left: calc(clamp(64px, 10vw, 84px) + 4px); right: calc(clamp(64px, 10vw, 84px) + 4px); bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; justify-content: safe center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 6px 4px 8px; }
.hud-feat::-webkit-scrollbar { display: none; }
.fhd { flex: none; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; letter-spacing: .1em; }
.ftile { --fh: clamp(46px, 19vh, 80px); flex: none; position: relative; height: var(--fh); aspect-ratio: 16 / 9; border-radius: 12px; background-size: 100% 100%; border: 3px solid var(--gold2); box-shadow: 0 0 0 2px var(--ol), 0 4px 0 2px var(--ol), 0 8px 14px rgba(20,5,30,.4); overflow: hidden; }
.ftile:active { transform: translateY(2px); }
.ftag { position: absolute; top: 0; left: 0; padding: 1px 6px 2px; border-radius: 0 0 8px 0; background: linear-gradient(180deg, var(--green1), var(--green2)); color: #fff; font-size: 9px; font-weight: 700; text-shadow: 0 1px 0 var(--ol); white-space: nowrap; }
.fnm { position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 4px 2px; background: rgba(40,12,64,.82); color: #fff; font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rgrow b { display: flex; align-items: center; gap: 2px; }
.rgrow b svg { width: 22px; height: 22px; }
.rgrow .b3 { padding: 3px 10px; font-size: 15px; justify-self: start; }
.rgrow small { color: #ffe58f; font-size: 11.5px; }

}

function curRecipe() { return RECIPES[R.recipeIdx % 3]; }

}

function shapeMini(cells) { var set = {}; cells.forEach(function (i) { set[i] = 1; }); return '<span class="smini">' + range(0, 24).map(function (i) { return '<i' + (set[i] ? ' class="on"' : '') + '></i>'; }).join('') + '</span>'; }

/* ---------- Garden Path: the featured rooms' bonus game ---------- */
function bonusPct(room) { return Math.min(100, Math.round((S.bonus && S.bonus[room]) || 0)); }
function gardenPath(bet, room) {

  for (var c = 0; c < cols; c++) { var a = stone(c), b = c > 1 && Math.random() < .3 ? { t: 'splash' } : stone(c); steps.push(Math.random() < .5 ? [a, b] : [b, a]); }
  function lbl(st) { return st.t === 'splash' ? '<small>Splash!</small>' : st.t === 'hop' ? '<small>Hop</small><b>+2</b>' : '<b>' + st.n + '</b><small>tickets</small>'; }
  function draw(v) {
    $('#gpPath', v).innerHTML = steps.map(function (s, ci) {
      return '<div class="pcol' + (ci === pos && !over ? ' on' : '') + (ci < pos ? ' past' : '') + '">' + s.map(function (st, j) {
        return '<button class="stone' + (st.open ? ' open ' + st.t : '') + (st.dim ? ' dim' : '') + '" data-c="' + ci + '" data-j="' + j + '"' + (ci !== pos || over || st.open ? ' disabled' : '') + '>' + (st.open ? lbl(st) : '<b>?</b>') + '</button>';
      }).join('') + '</div>';
    }).join('') + '<div class="fountain' + (pos >= cols ? ' won' : '') + '"><svg viewBox="0 0 40 40"><use href="#i-drop"/></svg><b>Grand Prize</b><small>' + grand + ' tickets<br>+ a gold card</small></div>';
    $('#gpWon', v).textContent = won;
  }
  panel('<h3>Garden Path</h3><p>Pick a stone in each row: tickets, a Hop ahead, or a Splash that ends the walk (you keep your tickets). The first two rows are safe. Reach the fountain for the Grand Prize!</p>' +
    '<div class="gpath" id="gpPath"></div><div class="res-btns" style="align-items:center"><span class="pill2">' + icon('i-ticket') + '<b id="gpWon">0</b></span><span id="gpMsg" style="font-weight:600"></span><button class="b3 gold" id="gpDone" hidden>Collect</button></div>', '', function (v) {
      v.querySelector('[data-x]').remove();
      draw(v);
      v.addEventListener('click', function (e) {
        var b = e.target.closest('.stone'); if (!b || b.disabled || over) return;
        var ci = +b.dataset.c, j = +b.dataset.j, st = steps[ci][j], other = steps[ci][1 - j];
        st.open = true; other.open = true; other.dim = true;
        if (st.t === 'splash') { over = true; SFX.no(); var cons = 10 * bet; won += cons; S.tickets += cons; $('#gpMsg', v).textContent = 'Splash! The walk is over. +' + cons + ' tickets for the walk.'; }
        else if (st.t === 'hop') { pos = Math.min(cols, pos + 2); SFX.boost(); }
        else { won += st.n; S.tickets += st.n; pos++; SFX.coin(); }
        if (pos >= cols && !over) { over = true; won += grand; S.tickets += grand; var gc = grant({ t: 'gcard', n: 1 }); SFX.set(); sparkle(innerWidth * .8, innerHeight / 2, 140); $('#gpMsg', v).textContent = 'You reached the fountain! Grand Prize and ' + gc.replace(/^\+/, '') + '.'; }
        logEvent({ t: 'gardenPath', step: ci, prize: st.t }); save(); draw(v); refreshTop();
        if (over) { var dn = $('#gpDone', v); dn.hidden = false; dn.onclick = function () { closeVeil(); }; }
      });
    });
}

/* ---------- premium wheel and prize reveal ---------- */
function shadeHex(hex, f) { var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  function m(c) { return Math.max(0, Math.min(255, Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f)))); }
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')'; }
function luxWheel(ctx, W, segs, angle, t) {

  var rim = ctx.createLinearGradient(-R, -R, R, R); rim.addColorStop(0, '#fff3b8'); rim.addColorStop(.3, '#e9a81c'); rim.addColorStop(.55, '#ffe58f'); rim.addColorStop(.8, '#b8780a'); rim.addColorStop(1, '#ffd45c');
  ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(0, 0, R + 16, 0, 7); ctx.fill();

  ctx.fillStyle = '#4f1fa3'; ctx.beginPath(); ctx.arc(0, 0, R + 3, 0, 7); ctx.fill();

    var a = i / 20 * Math.PI * 2, on = (Math.floor(t * 6) + i) % 2 === 0, bx = Math.cos(a) * (R + 9.5), by = Math.sin(a) * (R + 9.5);

  ctx.rotate(-angle); ctx.fillStyle = shine; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  var hub = ctx.createRadialGradient(-6, -7, 2, 0, 0, 26); hub.addColorStop(0, '#fff8d6'); hub.addColorStop(.5, '#f7b924'); hub.addColorStop(1, '#a8740a');
  ctx.fillStyle = hub; ctx.beginPath(); ctx.arc(0, 0, 24, 0, 7); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#3d1a4f'; ctx.stroke();
  var gem = ctx.createRadialGradient(-4, -5, 1, 0, 0, 15); gem.addColorStop(0, '#f3e1ff'); gem.addColorStop(.5, '#9b5cff'); gem.addColorStop(1, '#4f1fa3');
  ctx.fillStyle = gem; ctx.beginPath(); for (i = 0; i < 10; i++) { var ra = i % 2 ? 6.5 : 14, aa = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(Math.cos(aa) * ra, Math.sin(aa) * ra); } ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();

  var rb = ctx.createRadialGradient(-2, -6, 1, 0, -4, 7); rb.addColorStop(0, '#ffd6e3'); rb.addColorStop(.6, '#e5383b'); rb.addColorStop(1, '#8a1020');

function wheelIndexAt(angle, n) { var seg = Math.PI * 2 / n; return Math.floor(((-angle % (Math.PI * 2)) + Math.PI * 4) % (Math.PI * 2) / seg) % n; }
